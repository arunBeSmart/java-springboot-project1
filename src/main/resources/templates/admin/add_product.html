<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
	<meta charset="ISO-8859-1" >
  <title>Add Course - CloudDevOpsHub Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous" >
</head>
<body>
	<section>
		<div class="container py-5">
			<div class="row justify-content-center">
				<div class="col-lg-8">
					<div class="card rounded-4 border-0 shadow-lg overflow-hidden">
						<div class="card-header p-4" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
							<h3 class="mb-0"><i class="fas fa-book-plus me-2"></i> Add New Course</h3>
						</div>
						<div class="card-body p-5">
							<form>
								<!-- Course Title -->
								<div class="mb-4">
									<label class="form-label fw-bold">Course Title <span class="text-danger">*</span></label>
									<input type="text" name="title" class="form-control form-control-lg rounded-3" placeholder="e.g., DevOps Fundamentals" required>
									<small class="text-muted">Enter an engaging course title</small>
								</div>

								<!-- Course Description -->
								<div class="mb-4">
									<label class="form-label fw-bold">Description <span class="text-danger">*</span></label>
									<textarea rows="4" class="form-control form-control-lg rounded-3" placeholder="Write a detailed course description..." required></textarea>
									<small class="text-muted">Describe what students will learn</small>
								</div>

								<div class="row">
									<!-- Category -->
									<div class="col-md-6 mb-4">
										<label class="form-label fw-bold">Category <span class="text-danger">*</span></label>
										<select class="form-select form-select-lg rounded-3" required>
											<option value="">-- Select Category --</option>
											<option value="devops">DevOps Engineering</option>
											<option value="kubernetes">Kubernetes</option>
											<option value="docker">Docker</option>
											<option value="cloud">Cloud Computing</option>
											<option value="git">Git & Version Control</option>
										</select>
									</div>

									<!-- Level -->
									<div class="col-md-6 mb-4">
										<label class="form-label fw-bold">Level <span class="text-danger">*</span></label>
										<select class="form-select form-select-lg rounded-3" required>
											<option value="">-- Select Level --</option>
											<option value="beginner">Beginner</option>
											<option value="intermediate">Intermediate</option>
											<option value="advanced">Advanced</option>
										</select>
									</div>
								</div>

								<div class="row">
									<!-- Price -->
									<div class="col-md-6 mb-4">
										<label class="form-label fw-bold">Price ($) <span class="text-danger">*</span></label>
										<input type="number" name="price" class="form-control form-control-lg rounded-3" placeholder="49.99" step="0.01" required>
										<small class="text-muted">Set the course price</small>
									</div>

									<!-- Original Price -->
									<div class="col-md-6 mb-4">
										<label class="form-label fw-bold">Original Price ($)</label>
										<input type="number" name="original_price" class="form-control form-control-lg rounded-3" placeholder="99.99" step="0.01">
										<small class="text-muted">For discount display</small>
									</div>
								</div>

								<div class="row">
									<!-- Duration -->
									<div class="col-md-6 mb-4">
										<label class="form-label fw-bold">Duration (Hours)</label>
										<input type="number" name="duration" class="form-control form-control-lg rounded-3" placeholder="25" min="1">
										<small class="text-muted">Total course hours</small>
									</div>

									<!-- Stock/Seats -->
									<div class="col-md-6 mb-4">
										<label class="form-label fw-bold">Available Seats</label>
										<input type="number" name="stock" class="form-control form-control-lg rounded-3" placeholder="100" min="1">
										<small class="text-muted">Number of seats available</small>
									</div>
								</div>

								<!-- Course Image -->
								<div class="mb-4">
									<label class="form-label fw-bold">Course Cover Image <span class="text-danger">*</span></label>
									<div class="input-group mb-3">
										<input type="file" name="image" class="form-control form-control-lg rounded-start-3" accept="image/*" required>
										<span class="input-group-text rounded-end-3 bg-light">
											<i class="fas fa-image text-muted"></i>
										</span>
									</div>
									<small class="text-muted">Upload a course cover image (JPG, PNG)</small>
								</div>

								<!-- Course Content -->
								<div class="mb-4">
									<label class="form-label fw-bold">Key Topics (comma-separated)</label>
									<textarea rows="3" class="form-control form-control-lg rounded-3" placeholder="CI/CD, Jenkins, GitLab, Infrastructure..."></textarea>
									<small class="text-muted">Enter key topics covered in the course</small>
								</div>

								<!-- Action Buttons -->
								<div class="d-flex gap-3 mt-5">
									<button type="submit" class="btn btn-lg btn-primary fw-bold rounded-3 flex-grow-1" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none;">
										<i class="fas fa-save me-2"></i> Publish Course
									</button>
									<a href="/admin/" class="btn btn-lg btn-outline-secondary fw-bold rounded-3 flex-grow-1">
										<i class="fas fa-times me-2"></i> Cancel
									</a>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
