<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
	<meta charset="ISO-8859-1" >
  <title>Login - CloudDevOpsHub</title>
</head>
<body>
	<section>
		<div class="container mt-5 pt-5 pb-5">
			<div class="row align-items-center justify-content-center">
			  <div class="col-md-5">
				<div class="card rounded-4 shadow-lg overflow-hidden border-0">
					<div class="card-header p-5 text-center" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
						<h2 class="mb-2"><i class="fas fa-sign-in-alt"></i> Welcome Back!</h2>
						<p class="mb-0">Login to your CloudDevOpsHub account</p>
					</div>
					<div class="card-body p-5">
						<form>
							<div class="mb-4">
								<label class="form-label fw-bold">Email Address</label>
								<input class="form-control form-control-lg rounded-3 border-2" name="email" type="email" placeholder="Enter your email" />
							</div>
							<div class="mb-3">
								<label class="form-label fw-bold">Password</label>
								<input class="form-control form-control-lg rounded-3 border-2" name="password" type="password" placeholder="Enter your password" />
							</div>
							<div class="mb-4 form-check">
								<input type="checkbox" class="form-check-input" id="rememberMe">
								<label class="form-check-label" for="rememberMe">Remember me</label>
							</div>
							<button type="submit" class="btn btn-lg w-100 text-white fw-bold rounded-3" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
								<i class="fas fa-sign-in-alt me-2"></i> Login Now
							</button>
						</form>
					</div>
					<div class="card-footer p-4 text-center bg-light">
						<p class="mb-3"><a href="#" class="text-decoration-none text-primary fw-bold">Forgot Password?</a></p>
						<p class="mb-0">Don't have an account? 
							<a href="/register" class="text-decoration-none text-primary fw-bold">Create one now</a>
						</p>
					</div>
				</div>
			  </div>
		  </div>
		</div>
	</section>
</body>
</html>
