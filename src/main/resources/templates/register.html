<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
	<meta charset="ISO-8859-1" >
  <title>Register - CloudDevOpsHub</title>
</head>
<body>
	<section>
		<div class="container mt-5 pt-3 pb-5">
			<div class="row align-items-center justify-content-center">
				<div class="col-lg-6">
					<div class="card rounded-4 shadow-lg overflow-hidden border-0">
						<div class="card-header p-4 text-center" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
							<h2 class="mb-2"><i class="fas fa-user-plus"></i> Join CloudDevOpsHub</h2>
							<p class="mb-0">Create your account and start learning</p>
						</div>
						<div class="card-body p-5">
							<form>
								<div class="row mb-3">
									<div class="col-md-6">
										<label class="form-label fw-bold">Full Name</label>
										<input class="form-control form-control-lg rounded-3 border-2" name="name" type="text" placeholder="Enter your name" />
									</div>
									<div class="col-md-6">
										<label class="form-label fw-bold">Mobile Number</label>
										<input class="form-control form-control-lg rounded-3 border-2" name="mobileNumber" type="tel" placeholder="10-digit number" />
									</div>
								</div>
								<div class="mb-3">
									<label class="form-label fw-bold">Email Address</label>
									<input class="form-control form-control-lg rounded-3 border-2" name="email" type="email" placeholder="Enter your email" />
								</div>
								<div class="row mb-3">
									<div class="col-md-6">
										<label class="form-label fw-bold">Address</label>
										<input class="form-control form-control-lg rounded-3 border-2" name="address" type="text" placeholder="Street address" />
									</div>
									<div class="col-md-6">
										<label class="form-label fw-bold">City</label>
										<input class="form-control form-control-lg rounded-3 border-2" name="city" type="text" placeholder="City" />
									</div>
								</div>
								<div class="row mb-3">
									<div class="col-md-6">
										<label class="form-label fw-bold">State</label>
										<input class="form-control form-control-lg rounded-3 border-2" name="state" type="text" placeholder="State" />
									</div>
									<div class="col-md-6">
										<label class="form-label fw-bold">Pincode</label>
										<input class="form-control form-control-lg rounded-3 border-2" name="pincode" type="number" placeholder="Postal code" />
									</div>
								</div>
								<div class="row mb-3">
									<div class="col-md-6">
										<label class="form-label fw-bold">Password</label>
										<input class="form-control form-control-lg rounded-3 border-2" name="password" type="password" placeholder="Create password" />
									</div>
									<div class="col-md-6">
										<label class="form-label fw-bold">Confirm Password</label>
										<input class="form-control form-control-lg rounded-3 border-2" name="cpassword" type="password" placeholder="Confirm password" />
									</div>
								</div>
								<div class="mb-4">
									<label class="form-label fw-bold">Profile Picture</label>
									<input class="form-control form-control-lg rounded-3 border-2" name="profile_image" type="file" />
								</div>
								<div class="form-check mb-4">
									<input type="checkbox" class="form-check-input" id="agreeTerms" required>
									<label class="form-check-label" for="agreeTerms">I agree to the <a href="#" class="text-primary fw-bold">Terms & Conditions</a></label>
								</div>
								<button type="submit" class="btn btn-lg w-100 text-white fw-bold rounded-3" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
									<i class="fas fa-user-check me-2"></i> Create Account
								</button>
							</form>
						</div>
						<div class="card-footer p-4 text-center bg-light">
							<p class="mb-0">Already have an account? 
								<a href="/login" class="text-decoration-none text-primary fw-bold">Login here</a>
							</p>
						</div>
					</div>
				</div>
			</div>
		</div>	
	</section>
</body>
</html>
